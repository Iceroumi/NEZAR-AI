<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEZAR</title>
<link rel="icon" type="image/png" href="icons/icon128.png" />
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png" />
<style>
  :root {
    --grad-from: #0e0f13;
    --grad-to: #14161c;
    /* Плотные (без прозрачности) фоновые цвета — строгий/упорный стиль */
    --glass: #1b1e26;
    --glass-strong: #252932;
    --glass-border: #2f343f;
    --text: rgb(228, 224, 230);
    --text-dim: rgb(160, 158, 165);
    --text-mute: rgb(98, 98, 105);
    --accent: rgb(128, 110, 255);
    --accent-hover: rgb(148, 130, 175);
    --green: #019A5A;
    --green-soft: #019A5A;
    --green-soft-2: #01b86c;
    --green-shadow: rgba(1, 154, 90, 0.25);
    --color-secondary: rgb(158, 78, 218);
    --success: #4caf50;
    --error: #f44336;
    --warn: #ff9800;
    --border: #252525;
    --radius-lg: 12px;
    --radius-md: 8px;
    --radius-sm: 4px;
    --sidebar-w: 240px;
    --blockly-width: 480px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
  }
  body {
    display: flex;
    background: var(--grad-from);
  }

  /* ===== Sidebar ===== */
  .sidebar {
    flex: 0 0 var(--sidebar-w);
    overflow: hidden;
    transition: flex-basis 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
  }
  body.sidebar-collapsed .sidebar {
    flex-basis: 0;
    opacity: 0;
    pointer-events: none;
  }
  .sidebar-inner {
    width: var(--sidebar-w);
    height: 100vh;
    background: #0a0b0e;
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 14px 20px 18px;
    border-bottom: 1px solid var(--glass-border);
  }
  .brand .logo {
    width: 32px;
    height: 32px;
    background: var(--green-soft);
    border-radius: var(--radius-md);
    padding: 4px;
    flex: 0 0 auto;
    box-shadow: 0 4px 12px var(--green-shadow);
  }
  .brand .logo svg { width: 100%; height: 100%; display: block; }
  .brand .titles { flex: 1 1 auto; min-width: 0; }
  .brand .title {
    font-weight: 600;
    font-size: 15px;
    line-height: 1.2;
  }
  .brand .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .sidebar-collapse-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sidebar-collapse-btn:hover { background: var(--glass); color: var(--text); }
  .sidebar-collapse-btn svg { width: 16px; height: 16px; }

  .sidebar-expand-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 100;
    width: 38px;
    height: 38px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    background: #1b1e26;
    color: var(--text);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .sidebar-expand-btn:hover { background: #252932; transform: scale(1.05); }
  .sidebar-expand-btn svg { width: 18px; height: 18px; }
  body.sidebar-collapsed .sidebar-expand-btn { display: flex; }

  nav.nav {
    padding: 16px 10px;
    flex: 1 1 auto;
    overflow-y: auto;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    border-radius: var(--radius-md);
    margin-bottom: 4px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .nav-item:hover { background: var(--glass); color: var(--text); }
  .nav-item.active {
    background: var(--green-soft);
    color: #fff;
    box-shadow: 0 4px 12px var(--green-shadow);
  }
  .nav-item .ico { font-size: 18px; width: 20px; text-align: center; flex: 0 0 auto; }
  .nav-item .label { flex: 1 1 auto; }

  .nav-divider { height: 1px; background: var(--glass-border); margin: 8px 10px; }

  .sidebar-footer {
    padding: 14px 18px;
    border-top: 1px solid var(--glass-border);
    font-size: 11px;
    color: var(--text-dim);
  }
  .sidebar-footer .conn-label { color: var(--text-mute); margin-bottom: 4px; }
  .sidebar-footer .conn-value {
    color: var(--text);
    word-break: break-all;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
  }
  .sidebar-footer .conn-value.ok { color: var(--success); }
  .sidebar-footer .conn-value.err { color: var(--error); }
  .sidebar-footer .conn-value.warn { color: var(--warn); }
  .sidebar-footer .reconnect-btn {
    margin-top: 6px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 10px;
    cursor: pointer;
    display: none;
  }
  .sidebar-footer .reconnect-btn:hover { background: var(--glass-strong); color: var(--text); }
  .sidebar-footer .reconnect-btn.show { display: inline-block; }

  /* ===== Content ===== */
  .content {
    flex: 1 1 auto;
    overflow-y: auto;
    position: relative;
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ===== NEW PROJECT view — split chat | blockly ===== */
  #view-new-project {
    position: relative;
    height: 100vh;
    overflow: hidden;
    /* По умолчанию блоки открыты — Blockly инициализируется сразу */
    display: flex;
    flex-direction: row;
  }
  .np-chat-side {
    flex: 1 1 auto;
    position: relative;
    height: 100vh;
    overflow: hidden;
    min-width: 0;
  }
  .np-resizer {
    flex: 0 0 6px;
    cursor: ew-resize;
    background: var(--border);
    height: 100vh;
    z-index: 50;
    transition: background 0.15s ease;
  }
  .np-resizer:hover { background: var(--accent); }
  .np-resizer.active { background: var(--accent); }
  .np-blockly-side {
    flex: 0 0 var(--blockly-width);
    position: relative;
    height: 100vh;
    overflow: hidden;
    background: var(--grad-from);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  body.blockly-closed #view-new-project { display: block; }
  body.blockly-closed .np-resizer { display: none; }
  body.blockly-closed .np-blockly-side { display: none; }

  .project-header {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    width: 719px;
    max-width: calc(100% - 80px);
    text-align: center;
  }
  .project-title-input {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text);
    font-size: 26px;
    font-weight: 600;
    font-family: inherit;
    text-align: center;
    padding: 6px 14px;
    outline: none;
    width: 100%;
    letter-spacing: -0.3px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .project-title-input::placeholder { color: var(--text-mute); }
  .project-title-input:hover { background: var(--glass); }
  .project-title-input:focus { background: var(--glass); border-color: var(--green-soft); }
  .project-subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 6px;
  }

  .project-history {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 719px;
    max-width: calc(100% - 80px);
    max-height: calc(100vh - 260px);
    overflow-y: auto;
    z-index: 2;
    padding: 4px 0;
  }
  .project-history::-webkit-scrollbar { width: 4px; }
  .project-history::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }
  .project-history-empty {
    text-align: center;
    color: var(--text-mute);
    font-size: 13px;
    padding: 60px 0;
  }
  .ph-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0;
    margin-bottom: 8px;
    font-size: 13px;
  }
  /* Только ПРОМПТ (role-user) остаётся пузырём диалога */
  .ph-item.role-user {
    margin-left: auto;
    max-width: 75%;
    padding: 10px 14px;
    background: #16283a;
    border: 1px solid #1f4060;
    border-right: 3px solid var(--accent);
    border-radius: var(--radius-md);
    border-top-right-radius: 2px;
    border-bottom-right-radius: 2px;
  }
  /* AI / assistant — плоский текст на фоне, без карточки */
  .ph-item.role-ai,
  .ph-item.role-assistant {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0 0 14px 0;
    max-width: 100%;
  }
  .ph-item.role-ai .ph-header,
  .ph-item.role-assistant .ph-header {
    display: none;  /* у плоских сообщений нет шапки-карточки */
  }
  /* Заголовок у role-ai — БОЛЬШИМ шрифтом, основной визуальный акцент */
  .ph-item.role-ai .ph-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
    margin: 0 0 8px 0;
    letter-spacing: -0.2px;
  }
  /* Тело у role-ai — меньше, моноширинный */
  .ph-item.role-ai .ph-body {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--text-dim);
    word-break: break-all;
    white-space: pre-wrap;
    line-height: 1.55;
  }
  /* assistant (terminal, open_tab, etc.) — обычный плоский текст */
  .ph-item.role-assistant .ph-body {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--text-dim);
    word-break: break-all;
    white-space: pre-wrap;
    line-height: 1.55;
  }
  /* user-пузырь: его собственная шапка остаётся */
  .ph-item.role-user .ph-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
  }
  .ph-item .ph-role {
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 600;
  }
  .ph-item.role-user .ph-role { color: var(--accent); }
  .ph-item.role-assistant .ph-role { color: var(--green); }
  .ph-item.role-ai .ph-role { color: #c084fc; }
  .ph-item .ph-time {
    color: var(--text-mute);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .ph-item .ph-pill {
    margin-left: auto;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--success);
    color: #fff;
    font-weight: 500;
  }
  .ph-item .ph-pill.err { background: var(--error); }
  .ph-item.role-user .ph-body {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    word-break: break-all;
    white-space: pre-wrap;
    line-height: 1.5;
    color: var(--text);
  }
  .ph-item .ph-error { color: var(--error); font-size: 11px; margin-top: 4px; }

  /* Компактная мета-строка для плоских assistant-сообщений (terminal, open_tab, ошибки):
     только время + статус, мелким шрифтом, серым — без карточки */
  .ph-item .ph-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--text-mute);
    margin-bottom: 4px;
  }
  .ph-item .ph-meta .ph-pill {
    margin-left: 0;
    font-size: 9px;
    padding: 1px 6px;
  }
  .ph-copy {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--text-mute);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 3px;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
    flex: 0 0 auto;
  }
  .ph-item:hover .ph-copy { opacity: 1; }
  .ph-copy:hover { color: var(--text); background: var(--glass-strong); }
  .ph-copy.copied { color: var(--success); opacity: 1; }

  /* ============================================================
     Анимация загрузки (блок nezar_animate)
     Показывается плоским текстом на фоне, без карточки — как и другие
     сообщения. Живёт до тех пор, пока не придёт следующее сообщение.
     ============================================================ */
  .nezar-loading {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--text-dim);
    user-select: none;
    width: 100%;
  }
  .nezar-loading .ltxt { color: var(--text); font-weight: 500; }

  /* Точки (для dots и thinking) */
  .nezar-loading .ldot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    display: inline-block;
    animation: nezar-blink 1.4s infinite both;
  }
  .nezar-loading .ldot:nth-child(2),
  .nezar-loading .ltxt + .ldot { animation-delay: 0.2s; }
  .nezar-loading .ldot:nth-child(3),
  .nezar-loading .ltxt + .ldot + .ldot { animation-delay: 0.4s; }
  .nezar-loading .ldot:nth-child(4) { animation-delay: 0.6s; }
  @keyframes nezar-blink {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40%           { opacity: 1;    transform: translateY(-3px); }
  }

  /* Спиннер */
  .nezar-loading .lspin {
    width: 14px; height: 14px;
    border: 2px solid var(--glass-border);
    border-top-color: var(--text);
    border-radius: 50%;
    display: inline-block;
    animation: nezar-spin 0.8s linear infinite;
  }
  @keyframes nezar-spin { to { transform: rotate(360deg); } }

  /* Прогресс-бар */
  .nezar-loading .lbar {
    width: 200px; height: 4px;
    background: var(--glass);
    border-radius: 2px;
    overflow: hidden;
    display: inline-block;
    position: relative;
  }
  .nezar-loading .lbar-fill {
    position: absolute;
    top: 0; left: 0;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: nezar-slide 1.2s ease-in-out infinite;
  }
  @keyframes nezar-slide {
    0%   { left: -40%; }
    100% { left: 100%; }
  }

  /* Скелетон (shimmer) */
  .nezar-loading .lskel {
    display: block;
    width: 100%;
    max-width: 360px;
    height: 10px;
    background: var(--glass);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    margin-bottom: 6px;
  }
  .nezar-loading .lskel:last-child { max-width: 240px; margin-bottom: 0; }
  .nezar-loading .lskel::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--glass-strong), transparent);
    animation: nezar-shimmer 1.4s infinite;
  }
  @keyframes nezar-shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .processing-indicator {
    margin-right: auto;
    background: #20132e;
    border-color: #3a1f50;
    border-left: 3px solid #8a2be2;
  }
  .processing-indicator .ph-pill {
    background: #3a1f50;
    color: #c084fc;
    animation: pulse-pill 1.5s ease-in-out infinite;
  }
  @keyframes pulse-pill { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .typing-dots { display: inline-flex; gap: 4px; align-items: center; }
  .typing-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #c084fc;
    animation: typing-bounce 1.4s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }
  .typing-text { font-size: 13px; color: var(--text-dim); margin-left: 4px; }

  .project-empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 40px;
  }
  .project-empty-state h2 { font-size: 22px; font-weight: 600; margin: 16px 0 8px; }
  .project-empty-state p { color: var(--text-dim); font-size: 14px; margin: 0 0 24px; }
  .project-empty-state .btn { margin-top: 8px; }

  .np-prompt-wrap {
    position: absolute;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    width: 719px;
    max-width: calc(100% - 80px);
    z-index: 2;
  }
  .np-ai-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .ai-toggle, .blockly-toggle {
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--text-dim);
    border-radius: var(--radius-md);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    flex: 0 0 auto;
  }
  .ai-toggle:hover, .blockly-toggle:hover { background: var(--glass-strong); color: var(--text); }
  .ai-toggle.on {
    background: #2a1640;
    border-color: #5a2f7a;
    color: #c084fc;
  }
  .blockly-toggle.active {
    background: #2a1640;
    border-color: #5a2f7a;
    color: #c084fc;
  }
  .ai-status {
    font-size: 11px;
    color: var(--text-mute);
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ai-status.ok { color: var(--success); }
  .ai-status.err { color: var(--error); }

  .np-prompt-bar {
    box-sizing: border-box;
    height: 56px;
    background: #1b1e26;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    padding: 6px 6px 6px 20px;
    gap: 12px;
    transition: border-color 0.15s ease;
  }
  .np-prompt-bar:focus-within { border-color: var(--green-soft); }
  .np-prompt-bar input {
    flex: 1 1 auto;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    font-family: 'Inter', inherit;
    line-height: 150%;
    height: 100%;
  }
  .np-prompt-bar input::placeholder { color: var(--text-mute); }

  .np-send-btn {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(91.96deg, var(--green-soft) -16.64%, var(--green-soft-2) 117.28%);
    box-shadow: 0 4px 4px rgba(0, 0, 0, 0.05);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .np-send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 12px var(--green-shadow); }
  .np-send-btn:active { transform: translateY(0); }
  .np-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .np-send-btn svg { width: 20px; height: 20px; }

  .np-divider {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 32px;
    width: 314px;
    height: 1px;
    background: var(--glass-border);
  }
  .np-status {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    z-index: 3;
    width: 719px;
    max-width: calc(100% - 80px);
  }
  .np-status.ok { color: var(--success); }
  .np-status.err { color: var(--error); }

  /* ===== Buttons ===== */
  .btn {
    border: none;
    border-radius: var(--radius-md);
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .btn-primary {
    background: linear-gradient(91.96deg, var(--green-soft) -16.64%, var(--green-soft-2) 117.28%);
    color: #fff;
    box-shadow: 0 4px 12px var(--green-shadow);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--green-shadow); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-ghost {
    background: var(--glass);
    color: var(--text-dim);
    border: 1px solid var(--glass-border);
  }
  .btn-ghost:hover { background: var(--glass-strong); color: var(--text); }

  /* ===== Projects list ===== */
  .projects-section { padding: 4px 10px 8px; }
  .projects-header {
    font-size: 10px;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 12px 8px 6px;
    font-weight: 600;
  }
  .projects-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 280px;
    overflow-y: auto;
  }
  .projects-list::-webkit-scrollbar { width: 4px; }
  .projects-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }
  .project-item {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-bottom: 2px;
    border-radius: var(--radius-md);
    transition: background 0.12s ease;
  }
  .project-item:hover { background: var(--glass); }
  .project-item.active { background: var(--green-soft); }
  .project-item.active .project-name { color: #fff; }
  .project-item.active .project-delete { color: rgba(255,255,255,0.6); }
  .project-item.active .project-delete:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .project-name {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    min-width: 0;
    overflow: hidden;
  }
  .project-name .proj-ico { flex: 0 0 auto; font-size: 13px; opacity: 0.7; }
  .project-name .proj-name-text {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .project-delete {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--text-mute);
    cursor: pointer;
    border-radius: 4px;
    font-size: 18px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    margin-right: 6px;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .project-item:hover .project-delete { display: flex; }
  .project-delete:hover { background: rgba(244, 67, 54, 0.25); color: var(--error); }
  .projects-empty {
    padding: 14px 12px;
    font-size: 12px;
    color: var(--text-mute);
    font-style: italic;
  }

  /* ===== Blockly panel ===== */
  .blocklySvg { background-color: var(--grad-from) !important; }
  .blocklyMainBackground { fill: var(--grad-from) !important; fill-opacity: 1 !important; }
  .blocklyGrid line { stroke: #333 !important; }
  .blocklyToolboxDiv { background: #121212 !important; border-top: 1px solid var(--border); }
  .blocklyToolboxCategory { color: var(--text-dim) !important; }
  .blocklyToolboxCategory:hover { background: rgba(128, 110, 255, 0.15) !important; color: var(--text) !important; }
  .blocklyToolboxCategorySelected { background: rgba(128, 110, 255, 0.2) !important; color: var(--text) !important; }
  .blocklyToolboxCategoryLabel { color: var(--text-dim) !important; font-weight: 500; }
  .blocklyToolboxCategorySelected .blocklyToolboxCategoryLabel { color: var(--text) !important; }
  .blocklyFlyoutBackground { fill: #1a1a1a !important; fill-opacity: 0.98 !important; }
  .blockly-panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--grad-to);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .blockly-panel-title {
    font-size: 13px;
    font-weight: 600;
    color: #c084fc;
    flex: 0 0 auto;
  }
  .blockly-panel-run {
    flex: 1 1 auto;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .blockly-panel-run:hover { background: var(--accent-hover); }
  .blockly-panel-run:disabled { opacity: 0.5; cursor: not-allowed; }
  .blockly-panel-stop {
    flex: 0 0 auto;
    border: none;
    background: var(--error);
    color: #fff;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .blockly-panel-stop:hover { background: #d32f2f; }
  body.blockly-running .blockly-panel-run { display: none; }
  body.blockly-running .blockly-panel-stop { display: flex; }
  body.blockly-running .np-send-btn { opacity: 0.5; pointer-events: none; }
  .blockly-panel-dump {
    flex: 0 0 auto;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: #00ff88;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .blockly-panel-dump:hover { background: var(--glass-strong); color: #00cc66; }

  /* ============================================================
     Skeleton-анимация для выполняемого блока (React/Material style)
     — серый placeholder закрывает блок + бегущая полоса света (wave)
     ============================================================ */
  /* Тонкая золотая обводка — показывает КАКОЙ блок сейчас active
     (не пульсирует, просто визуальная метка) */
  .nezar-executing > .blocklyPath {
    stroke: #FFD700 !important;
    stroke-width: 2 !important;
  }
  /* Base overlay — серый placeholder, закрывает содержимое блока */
  .nezar-skeleton-base {
    pointer-events: none;
  }
  /* Shimmer overlay — бегущая полоса света поверх base */
  .nezar-skeleton-shimmer {
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .btn-ghost.blockly-copy-btn,
  .btn-ghost.blockly-paste-btn,
  .btn-ghost.blockly-export-btn,
  .btn-ghost.blockly-import-btn {
    padding: 4px 8px;
    font-size: 14px;
  }
  .blockly-panel-close {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    border-radius: 4px;
    flex: 0 0 auto;
  }
  .blockly-panel-close:hover { background: var(--glass); color: var(--text); }
  .blockly-container {
    flex: 1 1 auto;
    overflow: hidden;
    min-height: 200px;
  }
</style>
</head>
<body>

<aside class="sidebar">
 <div class="sidebar-inner">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g clip-path="url(#clip_dash)">
          <rect width="149.185" height="115.001" rx="16" transform="matrix(-4.37114e-08 -1 0.999995 -0.00309421 -11 14)" fill="white"/>
          <rect width="149.185" height="115.001" rx="14" transform="matrix(-4.37114e-08 -1 0.999995 -0.00309421 26 263)" fill="white"/>
          <rect width="42.7772" height="43.0002" rx="7" transform="matrix(-4.37114e-08 -1 0.999995 -0.00309421 42 85)" fill="white"/>
          <rect width="149.185" height="115.001" rx="16" transform="matrix(-4.37114e-08 -1 0.999995 -0.00309421 -103 181)" fill="white"/>
          <rect width="149.185" height="115.001" rx="11" transform="matrix(-4.37114e-08 -1 0.999995 -0.00309421 117 100)" fill="white"/>
        </g>
        <defs>
          <clipPath id="clip_dash">
            <rect width="128" height="128" fill="white" transform="translate(5.72205e-06 128) rotate(-90)"/>
          </clipPath>
        </defs>
      </svg>
    </div>
    <div class="titles">
      <div class="title">NEZAR</div>
      <div class="subtitle">визуальный AI-агент</div>
    </div>
    <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Свернуть панель" aria-label="Свернуть панель">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15 6 L9 12 L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
  </div>

  <nav class="nav">
    <button class="nav-item" id="new-project-btn">
      <span class="ico">✦</span>
      <span class="label">Новый проект</span>
    </button>

    <div class="nav-divider"></div>

    <div class="projects-section">
      <div class="projects-header">Проекты</div>
      <ul class="projects-list" id="projects-list">
        <li class="projects-empty">Нет проектов</li>
      </ul>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="conn-label">Native host:</div>
    <div class="conn-value err" id="conn-status">проверка…</div>
    <button class="reconnect-btn" id="reconnect-btn">Перепроверить</button>
  </div>
 </div>
</aside>

<main class="content">

 <button class="sidebar-expand-btn" id="sidebar-expand-btn" title="Показать панель" aria-label="Показать панель">
   <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
     <path d="M9 6 L15 12 L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   </svg>
 </button>

  <!-- ===== View: Проект (chat + blockly) ===== -->
  <section id="view-new-project" class="view active">

    <!-- ЛЕВАЯ СТОРОНА: ЧАТ -->
    <div class="np-chat-side" id="np-chat-side">

    <!-- Empty state: нет активного проекта -->
    <div class="project-empty-state" id="project-empty-state">
      <div style="font-size:48px;opacity:0.3;">✦</div>
      <h2>Нет активного проекта</h2>
      <p>Нажмите «Новый проект» в боковой панели, чтобы создать первый.</p>
      <button type="button" class="btn btn-primary" id="empty-state-create-btn">Создать проект</button>
    </div>

    <!-- Активный проект: заголовок + история -->
    <div class="project-header" id="project-header" style="display:none;">
      <input type="text" class="project-title-input" id="project-title-input" value="Новый проект" placeholder="Название проекта" spellcheck="false" />
      <div class="project-subtitle">Опишите задачу — выполнится через терминал или AI</div>
    </div>

    <div class="project-history" id="project-history" style="display:none;">
      <div class="project-history-empty">Команды появятся здесь после отправки</div>
    </div>

    <div class="np-prompt-wrap">
      <div class="np-ai-bar">
        <button type="button" class="ai-toggle" id="ai-toggle">AI режим: ВЫКЛ</button>
        <span class="ai-status" id="ai-status">✗ не проверено</span>
        <button type="button" class="blockly-toggle active" id="blockly-toggle" title="Скрыть/показать блоки">🧩 Блоки</button>
      </div>
      <div class="np-prompt-bar">
        <input type="text" id="np-prompt" placeholder="Например: ls -la /tmp" autocomplete="off" spellcheck="false" />
        <button type="button" class="np-send-btn" id="np-send-btn" title="Отправить (Enter)">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M10 16 V4 M4 10 L10 4 L16 10" stroke="#E5E5E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="np-divider"></div>
    <div class="np-status" id="np-status"></div>

    </div><!-- /np-chat-side -->

    <!-- Ресайзер -->
    <div class="np-resizer" id="np-resizer"></div>

    <!-- ПРАВАЯ СТОРОНА: BLOCKLY (видна по умолчанию!) -->
    <div class="np-blockly-side" id="blockly-panel">
      <div class="blockly-panel-header">
        <span class="blockly-panel-title">🧩 Блоки</span>
        <button type="button" class="blockly-panel-run" id="blockly-run-btn" title="Запустить блоки (текст из поля ввода будет в блоке ПРОМПТ)">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M4 2 L13 8 L4 14 Z"/></svg>
          Run
        </button>
        <button type="button" class="blockly-panel-stop" id="blockly-stop-btn" title="Остановить выполнение">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10"/></svg>
          Stop
        </button>
        <button type="button" class="blockly-panel-dump" id="blockly-dump-btn" title="Показать все переменные в DevTools Console (зелёный лог)">
          🐛 dump vars
        </button>
        <button type="button" class="btn btn-ghost blockly-copy-btn" id="blockly-copy-btn" title="Копировать все блоки">⧉</button>
        <button type="button" class="btn btn-ghost blockly-paste-btn" id="blockly-paste-btn" title="Вставить блоки">📋</button>
        <button type="button" class="btn btn-ghost blockly-export-btn" id="blockly-export-btn" title="Сохранить блоки в файл">💾</button>
        <button type="button" class="btn btn-ghost blockly-import-btn" id="blockly-import-btn" title="Загрузить блоки из файла">📂</button>
        <input type="file" id="blockly-import-input" accept=".nezar.json,.json,.xml" style="display:none;">
        <button type="button" class="blockly-panel-close" id="blockly-panel-close">×</button>
      </div>
      <div id="blockly-container" class="blockly-container">
        <div id="blockly-workspace" style="width:100%;height:100%;"></div>
      </div>
      <xml id="blockly-toolbox" style="display:none;">
        <category name="Промпт" colour="#63A9AC">
          <block type="nezar_prompt"></block>
          <block type="nezar_text"></block>
          <block type="nezar_join"></block>
          <block type="nezar_extract_command"></block>
          <block type="nezar_regex"></block>
        </category>
        <category name="Действия" colour="#5757FF">
          <block type="nezar_send_deepseek"></block>
          <block type="nezar_send_qwen"></block>
          <block type="nezar_send_alice"></block>
          <block type="nezar_send_native"></block>
          <block type="nezar_open_tab"></block>
          <block type="nezar_print"></block>
          <block type="nezar_animate"></block>
        </category>
        <category name="Навыки" colour="#9B59B6">
          <block type="nezar_skill"></block>
          <block type="nezar_call_skill"></block>
        </category>
        <category name="Переменные" custom="VARIABLE" colour="#a55b80"></category>
        <category name="Логика" colour="#5b80a5">
          <block type="controls_if"></block>
          <block type="logic_compare"></block>
          <block type="logic_operation"></block>
          <block type="logic_negate"></block>
          <block type="logic_boolean"></block>
        </category>
        <category name="Циклы" colour="#5ba55b">
          <block type="controls_repeat_ext">
            <value name="TIMES">
              <shadow type="math_number">
                <field name="NUM">3</field>
              </shadow>
            </value>
          </block>
          <block type="controls_whileUntil"></block>
          <block type="nezar_wait">
            <value name="TIME">
              <shadow type="nezar_text">
                <field name="TEXT">1</field>
              </shadow>
            </value>
          </block>
        </category>
      </xml>
    </div><!-- /np-blockly-side -->

  </section>

</main>

<script src="blockly.min.js"></script>
<script src="blockly_msg_ru.js"></script>
<script src="blocks_compressed.js"></script>
<script src="javascript_compressed.js"></script>
<script src="blockly.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
